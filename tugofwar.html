<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tug of War Registration — Kochukeralam 2026</title>
<meta name="theme-color" content="#c99a2e">
<style>
:root{
  --ink:#1a2416; --gold:#c99a2e; --gold-deep:#a67c19; --leaf:#2f5233;
  --leaf-light:#eef3ec; --cream:#faf7ee; --sand:#f3ecd8; --line:#d8cfb4; --red:#b23a2e;
  --shadow:0 2px 12px rgba(60,50,20,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.55;padding-bottom:40px}
img{max-width:100%;display:block}
a{color:inherit}
.band{height:8px;background:repeating-linear-gradient(90deg,var(--gold) 0 24px,var(--red) 24px 48px,var(--leaf) 48px 72px)}
nav{position:sticky;top:0;z-index:50;background:rgba(250,247,238,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.navin{max-width:1000px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800;letter-spacing:.5px;color:var(--leaf);font-size:16px;text-decoration:none}
.brand span{color:var(--gold-deep)}
.back{font-size:13px;font-weight:600;color:var(--leaf);text-decoration:none}
.back:hover{color:var(--gold-deep)}
header.hero{text-align:center;padding:36px 18px 28px;background:linear-gradient(180deg,var(--sand),var(--cream));border-bottom:1px solid var(--line)}
.hero .logo{width:min(300px,74%);margin:0 auto 12px;height:auto}
.hero .flowers{font-size:22px;letter-spacing:8px;opacity:.55;margin-bottom:10px}
.hero .kicker{font-size:11.5px;letter-spacing:5px;text-transform:uppercase;color:var(--leaf);font-weight:700}
.hero h1{font-size:30px;line-height:1.15;margin:8px 0 6px}
.hero h1 span{color:var(--gold-deep)}
.hero .tag{color:#6b6551;font-size:14.5px}
.hero .rules{margin-top:12px;display:inline-block;background:var(--leaf-light);border:1px solid #cdddc9;color:var(--leaf);font-size:12.5px;padding:8px 14px;border-radius:10px;max-width:420px}
.wrap{max-width:640px;margin:0 auto;padding:26px 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px;box-shadow:var(--shadow)}
.card h3.ch{font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--leaf);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card h3.ch::before{content:"";width:8px;height:8px;background:var(--gold);border-radius:50%}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.req{color:var(--red)}
input[type=text],input[type=tel]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:var(--cream);margin-bottom:16px;font-family:inherit}
input:focus{outline:2px solid var(--gold);border-color:var(--gold);background:#fff}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grp{border:1.5px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center;cursor:pointer;font-weight:700;font-size:13.5px;color:var(--leaf);background:var(--cream)}
.grp.on{border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(201,154,46,.2)}
.err{color:var(--red);font-size:12px;margin:-10px 0 12px;display:none}
.err.show{display:block}
.gamesblock{display:none;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.gamesblock.show{display:block}
.gamesblock h4{font-size:13px;letter-spacing:1px;color:var(--leaf);margin-bottom:4px}
.ghint{font-size:12px;color:#8a836c;margin-bottom:12px}
.gopt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--cream)}
.gopt:hover{border-color:var(--gold)}
.gopt.on{border-color:var(--gold);background:#fff}
.gopt input{width:20px;height:20px;accent-color:var(--leaf);flex-shrink:0}
.gopt .gname{font-size:14.5px;font-weight:600}
.submit{width:100%;padding:15px;border:none;border-radius:10px;background:var(--leaf);color:#fff;font-size:16px;font-weight:700;letter-spacing:1px;cursor:pointer}
.submit:hover{background:#264429}
.submit:disabled{background:#b7bfb2;cursor:not-allowed}
.done{text-align:center}
.done .tick{font-size:44px}
.done h3.ch{justify-content:center}
.sendstatus{font-size:13px;margin-top:10px;font-weight:600}
.sendstatus.ok{color:var(--leaf)}.sendstatus.warn{color:var(--red)}
.fallback{margin-top:14px;font-size:13px;background:#fff6e5;border:1px solid #e8d3a0;border-radius:10px;padding:12px 14px;text-align:left;display:none}
.fallback.show{display:block}
.wabtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:14px 0 6px;padding:14px 16px;border-radius:10px;background:#25D366;color:#fff;text-decoration:none;font-weight:700;font-size:15px}
.wabtn:hover{background:#1eb958}
.wanote{font-size:11.5px;color:#8a836c;margin-bottom:4px}
.again{margin-top:18px;background:none;border:1px solid var(--leaf);color:var(--leaf);padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:600}
.footnote{text-align:center;font-size:12px;color:#8a836c;margin-top:8px}
</style>
<style>
    .soon{max-width:560px;margin:26px auto;padding:0 18px}
    .soon .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px 26px;text-align:center;box-shadow:var(--shadow)}
    .soon .badge{display:inline-block;background:var(--leaf-light);border:1px solid #cdddc9;color:var(--leaf);font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:700;padding:7px 14px;border-radius:20px;margin-bottom:16px}
    .soon h2{font-size:24px;color:var(--leaf);margin-bottom:10px}
    .soon h2 span{color:var(--gold-deep)}
    .soon p{color:#6b6551;font-size:15px;line-height:1.6;margin-bottom:8px}
    .soon .back-btn{display:inline-block;margin-top:20px;background:var(--leaf);color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:13px 24px;border-radius:10px}
    .soon .back-btn:hover{background:#264429}
</style>
</head>
